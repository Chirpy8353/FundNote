<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F7F5F2" />
  <title>基金股票推荐整理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%235B8A8A'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='system-ui,sans-serif' font-weight='700'>基</text></svg>" />
  <meta name="app-version" content="1.4.2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #F7F5F2; --card: #FFFFFF; --text: #3A3A3A; --text2: #7A7A7A;
      --accent: #5B8A8A; --accent-soft: #E8F0F0; --divider: #E8E4DF;
      --header: #F0EDE8; --danger: #C75B5B; --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; padding-bottom: 80px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 100; background: var(--bg);
      padding: 14px 16px 10px; border-bottom: 1px solid var(--divider);
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h1 { font-size: 18px; font-weight: 600; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn {
      width: 38px; height: 38px; border: none; background: var(--header); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 18px;
    }
    .filter-bar { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
    .filter-btn {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--divider);
      background: var(--card); color: var(--text2); font-size: 13px; cursor: pointer;
    }
    .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .list-container { padding: 0 16px 20px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-code { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
    .card-meta { font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .card-content { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
    .card-status { font-size: 13px; font-weight: 500; }
    .status-bought { color: var(--accent); }
    .status-not { color: var(--text2); }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .mini-btn { padding: 5px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; background: var(--header); color: var(--text); }
    .mini-btn.primary { background: var(--accent-soft); color: var(--accent); }
    .table-header, .table-row {
      display: grid; grid-template-columns: 1.8fr 0.8fr 0.7fr 1.2fr 0.9fr 0.9fr;
      gap: 6px; padding: 12px 10px; font-size: 13px; align-items: center;
    }
    .table-header { background: var(--header); border-radius: 8px 8px 0 0; font-size: 12px; color: var(--text2); font-weight: 500; }
    .table-row { background: var(--card); border-bottom: 1px solid var(--divider); }
    .table-row:last-child { border-bottom: none; border-radius: 0 0 8px 8px; }
    .table-name { font-weight: 500; }
    .table-code { font-size: 11px; color: var(--text2); }
    .xueqiu-btn { display: inline-block; padding: 3px 8px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; font-size: 12px; text-decoration: none; }
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 15px; }
    .fab {
      position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 16px;
      background: var(--accent); color: white; border: none; font-size: 28px;
      box-shadow: 0 4px 16px rgba(91,138,138,0.35); cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .page { display: none; }
    .page.active { display: block; }
    .form-page, .detail-page { padding: 0 16px 40px; }
    .page-header { display: flex; align-items: center; gap: 12px; padding: 14px 0; position: sticky; top: 0; background: var(--bg); z-index: 10; }
    .back-btn { width: 36px; height: 36px; border: none; background: var(--header); border-radius: 10px; font-size: 18px; cursor: pointer; color: var(--text); }
    .page-title { font-size: 17px; font-weight: 600; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px 14px; border: 1px solid var(--divider); border-radius: 10px;
      background: var(--card); font-size: 15px; color: var(--text); outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .radio-group { display: flex; gap: 20px; padding: 8px 0; }
    .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text); cursor: pointer; }
    .buy-fields { display: none; margin-top: 12px; padding: 14px; background: var(--header); border-radius: 10px; }
    .buy-fields.show { display: block; }
    .btn-row { display: flex; gap: 12px; margin-top: 28px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--header); color: var(--text); }
    .btn-danger { background: #FDF0F0; color: var(--danger); }
    .detail-section { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .detail-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    .detail-value { font-size: 15px; margin-bottom: 14px; }
    .detail-content { white-space: pre-wrap; line-height: 1.6; }
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(247,245,242,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 999; font-size: 15px; color: var(--text2);
    }
    .loading-overlay.hidden { display: none; }
    .error-banner { background: #FDF0F0; color: var(--danger); padding: 10px 16px; font-size: 13px; text-align: center; display: none; }
    .error-banner.show { display: block; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-box { background: var(--card); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: var(--shadow); }
    .auth-box h2 { font-size: 18px; margin-bottom: 6px; text-align: center; }
    .auth-box .sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 20px; }
    .auth-box input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--divider); border-radius: 10px;
      font-size: 15px; margin-bottom: 12px; outline: none;
    }
    .auth-box input:focus { border-color: var(--accent); }
    .auth-error { color: var(--danger); font-size: 13px; text-align: center; margin-bottom: 10px; min-height: 20px; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text2); }
    .auth-switch span {
      color: var(--accent); cursor: pointer; font-weight: 600;
      padding: 6px 10px; display: inline-block; border-radius: 8px;
    }
    .auth-switch span:active { background: var(--accent-soft); }
    .version-tag {
      text-align: center; font-size: 11px; color: #aaa; margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="authPage" class="auth-page">
    <div class="auth-box">
      <h2 id="authTitle">登录</h2>
      <div class="auth-error" id="authError"></div>
      <input type="email" id="authEmail" placeholder="邮箱" autocomplete="email" />
      <input type="password" id="authPassword" placeholder="密码（至少6位）" autocomplete="current-password" />
      <button class="btn btn-primary" id="authSubmitBtn" style="width:100%;margin-top:4px;">登录</button>
      <div style="margin-top:14px;">
        <button class="btn btn-secondary" id="googleLoginBtn" style="width:100%;font-size:13px;">使用 Google 登录</button>
      </div>
      <div class="auth-switch" id="authSwitch">还没有账号？<a href="javascript:void(0)" id="switchToRegister" style="color:#5B8A8A;font-weight:600;margin-left:4px;">去注册</a></div>
      <div class="version-tag">版本 v1.4.2</div>
    </div>
  </div>

  <div id="appRoot" style="display:none;">
    <div id="loadingOverlay" class="loading-overlay hidden">处理中...</div>
    <div id="errorBanner" class="error-banner"></div>

    <div id="listPage" class="page active">
      <div class="topbar">
        <h1>基金股票推荐整理 <span style="font-size:11px;color:#aaa;font-weight:400;">v1.4.2</span></h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="trashBtn" title="回收站">🗑</button>
          <button class="icon-btn" id="refreshBtn" title="刷新">↻</button>
          <button class="icon-btn" id="viewToggleBtn" title="切换视图">≡</button>
          <button class="icon-btn" id="logoutBtn" title="退出">⎋</button>
        </div>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="bought">已买入</button>
        <button class="filter-btn" data-filter="not">未买入</button>
      </div>
      <div class="list-container" id="listContainer"></div>
      <button class="fab" id="addBtn">+</button>
    </div>

    <div id="formPage" class="page">
      <div class="form-page">
        <div class="page-header">
          <button class="back-btn" id="formBackBtn">←</button>
          <div class="page-title" id="formTitle">添加推荐</div>
        </div>
        <div class="form-group"><label>股票 / 基金名称 *</label><input type="text" id="inputName" placeholder="例如：贵州茅台" /></div>
        <div class="form-group"><label>代码</label><input type="text" id="inputCode" placeholder="例如：600519" /></div>
        <div class="form-group"><label>推荐来源</label><input type="text" id="inputSource" placeholder="例如：某公众号 / 雪球 / 研报" /></div>
        <div class="form-group"><label>推荐内容</label><textarea id="inputContent" placeholder="推荐理由或要点..."></textarea></div>
        <div class="form-group"><label>推荐时间</label><input type="date" id="inputDate" /></div>
        <div class="form-group">
          <label>是否买入</label>
          <div class="radio-group">
            <label><input type="radio" name="bought" value="0" checked /> 否</label>
            <label><input type="radio" name="bought" value="1" /> 是</label>
          </div>
          <div class="buy-fields" id="buyFields">
            <div class="form-group"><label>买入价格</label><input type="number" id="inputBuyPrice" placeholder="可选" step="0.01" /></div>
            <div class="form-group">
              <label>买入方式</label>
              <div class="radio-group">
                <label><input type="radio" name="buyType" value="shares" checked /> 按份数/股数</label>
                <label><input type="radio" name="buyType" value="amount" /> 按金额</label>
              </div>
            </div>
            <div class="form-group" id="sharesGroup">
              <label>买入份数 / 股数</label>
              <input type="number" id="inputBuyShares" placeholder="例如：100" step="1" />
              <div id="calcAmountHint" style="margin-top:8px;font-size:13px;color:#5B8A8A;display:none;"></div>
            </div>
            <div class="form-group" id="amountGroup" style="display:none;">
              <label>买入金额（元）</label>
              <input type="number" id="inputBuyAmount" placeholder="例如：5000" step="0.01" />
              <div id="calcSharesHint" style="margin-top:8px;font-size:13px;color:#5B8A8A;display:none;"></div>
            </div>
            <div class="form-group"><label>买入时间</label><input type="date" id="inputBuyDate" /></div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="formCancelBtn">取消</button>
          <button class="btn btn-primary" id="formSaveBtn">保存</button>
        </div>
      </div>
    </div>

    <div id="trashPage" class="page">
      <div class="form-page">
        <div class="page-header">
          <button class="back-btn" id="trashBackBtn">←</button>
          <div class="page-title">回收站</div>
        </div>
        <div id="trashList" class="list-container"></div>
      </div>
    </div>

    <div id="detailPage" class="page">
      <div class="detail-page">
        <div class="page-header">
          <button class="back-btn" id="detailBackBtn">←</button>
          <div class="page-title" id="detailTitle">详情</div>
        </div>
        <div class="detail-section" id="detailContent"></div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="detailEditBtn">编辑</button>
          <button class="btn btn-danger" id="detailDeleteBtn">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aaleusaehplfcwksxotl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbGV1c2FlaHBsZmN3a3N4b3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDEzNDUsImV4cCI6MjEwMjY3NzM0NX0.xdd2l-ch4jGJ49BA0zJobQD_m5_AbNNqS5Hs3kD9Sq8';

    let sbClient = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        console.error('Supabase SDK 未加载');
      }
    } catch (e) {
      console.error('Supabase 初始化失败', e);
    }

    let recommendations = [];
    let currentFilter = 'all';
    let currentView = 'card';
    let editingId = null;
    let isRegisterMode = false;

    // ===== 登录/注册界面切换（不依赖网络，必须最先可用）=====
    function setAuthMode(register) {
      isRegisterMode = !!register;
      var title = document.getElementById('authTitle');
      var btn = document.getElementById('authSubmitBtn');
      var sw = document.getElementById('authSwitch');
      var err = document.getElementById('authError');
      if (title) title.textContent = isRegisterMode ? '注册' : '登录';
      if (btn) btn.textContent = isRegisterMode ? '注册' : '登录';
      if (sw) {
        if (isRegisterMode) {
          sw.innerHTML = '已有账号？<a href="javascript:void(0)" id="switchToLogin" style="color:#5B8A8A;font-weight:600;margin-left:4px;">去登录</a>';
          var a = document.getElementById('switchToLogin');
          if (a) a.onclick = function(){ setAuthMode(false); return false; };
        } else {
          sw.innerHTML = '还没有账号？<a href="javascript:void(0)" id="switchToRegister" style="color:#5B8A8A;font-weight:600;margin-left:4px;">去注册</a>';
          var a = document.getElementById('switchToRegister');
          if (a) a.onclick = function(){ setAuthMode(true); return false; };
        }
      }
      if (err) err.textContent = '';
    }
    window.setAuthMode = setAuthMode;

    function showLoading(show) {
      document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
    }
    function showError(msg) {
      const b = document.getElementById('errorBanner');
      if (msg) { b.textContent = msg; b.classList.add('show'); } else b.classList.remove('show');
    }
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function formatDate(ts) {
      ts = normalizeTs(ts);
      if (!ts) return '-';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '-';
      return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function formatFullDate(ts) {
      ts = normalizeTs(ts);
      if (!ts) return '-';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '-';
      return d.toLocaleDateString('zh-CN');
    }
    function normalizeTs(v) {
      if (v == null || v === '') return null;
      if (typeof v === 'number' && !isNaN(v)) return v;
      const n = Number(v);
      if (!isNaN(n) && isFinite(n) && n > 1000000000) return n; // 时间戳
      const d = new Date(v);
      const t = d.getTime();
      return isNaN(t) ? null : t;
    }
    function toDateInputValue(ts) {
      ts = normalizeTs(ts);
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function fromDateInputValue(str) {
      if (!str) return null;
      const p = String(str).split('-');
      if (p.length !== 3) return null;
      const y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, day = parseInt(p[2], 10);
      if (!y || isNaN(m) || !day) return null;
      const d = new Date(y, m, day, 12, 0, 0, 0); // 用中午避免时区边界问题
      const t = d.getTime();
      return isNaN(t) ? null : t;
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function getXueqiuUrl(code) {
      if (!code || !/^\d{6}$/.test(code)) return null;
      let prefix = 'SH';
      if (code.startsWith('0') || code.startsWith('3') || code.startsWith('15') || code.startsWith('16') || code.startsWith('18')) prefix = 'SZ';
      if (code.startsWith('50') || code.startsWith('51') || code.startsWith('56') || code.startsWith('58')) prefix = 'SH';
      return 'https://xueqiu.com/S/' + prefix + code;
    }
    function getFiltered() {
      if (currentFilter === 'bought') return recommendations.filter(r => r.is_bought);
      if (currentFilter === 'not') return recommendations.filter(r => !r.is_bought);
      return recommendations;
    }

    async function loadData() {
      showLoading(true); showError('');
      try {
        const { data, error } = await sbClient.from('recommendations')
          .select('*')
          .is('deleted_at', null)
          .order('recommend_date', { ascending: false });
        if (error) throw error;
        recommendations = (data || []).map(r => ({
          ...r,
          recommend_date: normalizeTs(r.recommend_date),
          buy_date: normalizeTs(r.buy_date),
          deleted_at: normalizeTs(r.deleted_at),
          is_bought: r.is_bought === true || r.is_bought === 'true' || r.is_bought === 't' || r.is_bought === 1,
          buy_price: r.buy_price != null && r.buy_price !== '' ? Number(r.buy_price) : null,
          buy_shares: r.buy_shares != null && r.buy_shares !== '' ? Number(r.buy_shares) : null,
          buy_amount: r.buy_amount != null && r.buy_amount !== '' ? Number(r.buy_amount) : null
        }));
      } catch (e) {
        console.error(e);
        showError('读取数据失败：' + (e.message || e));
        recommendations = [];
      } finally {
        showLoading(false);
        renderList();
      }
    }

    async function saveItem(item) {
      showLoading(true);
      try {
        const { data: userData, error: userErr } = await sbClient.auth.getUser();
        if (userErr || !userData.user) throw new Error('请先登录');
        const row = {
          id: item.id, name: item.name, code: item.code || null, source: item.source || null,
          content: item.content || null, recommend_date: item.recommend_date, is_bought: !!item.is_bought,
          buy_price: item.buy_price, buy_type: item.buy_type, buy_shares: item.buy_shares,
          buy_amount: item.buy_amount, buy_date: item.buy_date,
          user_id: userData.user.id
        };
        const { error } = await sbClient.from('recommendations').upsert(row);
        if (error) throw error;
      } catch (e) {
        console.error(e);
        alert('保存失败：' + (e.message || e));
        throw e;
      } finally { showLoading(false); }
    }

    async function deleteItemById(id) {
      showLoading(true);
      try {
        const { error } = await sbClient.from('recommendations')
          .update({ deleted_at: Date.now() })
          .eq('id', id);
        if (error) throw error;
      } catch (e) {
        console.error(e);
        alert('删除失败：' + (e.message || e));
        throw e;
      } finally { showLoading(false); }
    }

    async function loadDeleted() {
      showLoading(true);
      try {
        const { data, error } = await sbClient.from('recommendations')
          .select('*')
          .not('deleted_at', 'is', null)
          .order('deleted_at', { ascending: false });
        if (error) throw error;
        return (data || []).map(r => ({
          ...r,
          recommend_date: normalizeTs(r.recommend_date),
          buy_date: normalizeTs(r.buy_date),
          deleted_at: normalizeTs(r.deleted_at),
          is_bought: r.is_bought === true || r.is_bought === 'true' || r.is_bought === 't' || r.is_bought === 1
        }));
      } catch (e) {
        console.error(e);
        alert('读取回收站失败：' + (e.message || e));
        return [];
      } finally { showLoading(false); }
    }

    async function recoverItem(id) {
      showLoading(true);
      try {
        const { error } = await sbClient.from('recommendations')
          .update({ deleted_at: null })
          .eq('id', id);
        if (error) throw error;
      } catch (e) {
        console.error(e);
        alert('恢复失败：' + (e.message || e));
        throw e;
      } finally { showLoading(false); }
    }

    async function permanentDelete(id) {
      showLoading(true);
      try {
        const { error } = await sbClient.from('recommendations').delete().eq('id', id);
        if (error) throw error;
      } catch (e) {
        console.error(e);
        alert('彻底删除失败：' + (e.message || e));
        throw e;
      } finally { showLoading(false); }
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      const list = getFiltered();
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">暂无记录<br>点击右下角 + 添加第一条推荐</div>';
        return;
      }
      if (currentView === 'card') {
        container.innerHTML = list.map(item => `
          <div class="card" data-id="${item.id}">
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-code">${escapeHtml(item.code || '')}</div>
            <div class="card-meta">来源：${escapeHtml(item.source || '未填写')} · ${formatDate(item.recommend_date)}</div>
            <div class="card-content">${escapeHtml(item.content || '')}</div>
            <div class="card-status ${item.is_bought ? 'status-bought' : 'status-not'}">
              ${item.is_bought ? '已买入' + (item.buy_price ? ' · 买入价 ' + item.buy_price : '') : '未买入'}
            </div>
          </div>`).join('');
      } else {
        let html = `<div class="table-header"><div>名称/代码</div><div>推荐日</div><div>状态</div><div>买入详情</div><div>来源</div><div>操作</div></div>`;
        html += list.map(item => {
          let buyInfo = '<span style="color:var(--text2)">-</span>';
          if (item.is_bought) {
            const parts = [];
            if (item.buy_shares) parts.push('数量: ' + item.buy_shares);
            if (item.buy_amount) parts.push('金额: ' + item.buy_amount + '元');
            if (item.buy_price) parts.push('价格: ' + item.buy_price);
            if (item.buy_date) parts.push('购入: ' + formatDate(item.buy_date));
            if (!parts.length) parts.push('已买入');
            buyInfo = parts.map(p => '<div style="font-size:11px;line-height:1.45;">' + p + '</div>').join('');
          }
          const xqUrl = getXueqiuUrl(item.code);
          return `<div class="table-row" data-id="${item.id}">
            <div><div class="table-name">${escapeHtml(item.name)}</div><div class="table-code">${escapeHtml(item.code || '')}</div></div>
            <div>${formatDate(item.recommend_date)}</div>
            <div class="${item.is_bought ? 'status-bought' : 'status-not'}">${item.is_bought ? '已买' : '未买'}</div>
            <div>${buyInfo}</div>
            <div style="color:var(--text2);font-size:12px;">${escapeHtml(item.source || '-')}</div>
            <div style="display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;align-items:center;">
              ${xqUrl ? '<a class="xueqiu-btn" href="'+xqUrl+'" target="_blank" rel="noopener">雪球</a>' : ''}
              <button class="mini-btn primary" data-action="edit" data-id="${item.id}" style="padding:3px 8px;">编辑</button>
              <button class="mini-btn" data-action="delete" data-id="${item.id}" style="padding:3px 8px;color:#C75B5B;">删除</button>
            </div></div>`;
        }).join('');
        container.innerHTML = html;
      }
      container.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (btn.dataset.action === 'detail') showDetail(id);
          if (btn.dataset.action === 'edit') openForm(id);
          if (btn.dataset.action === 'delete') {
            if (!confirm('确定删除？可在回收站恢复')) return;
            try {
              await deleteItemById(id);
              recommendations = recommendations.filter(r => r.id !== id);
              renderList();
            } catch (err) {}
          }
        });
      });
      container.querySelectorAll('.card[data-id]').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.closest('button') || e.target.closest('a')) return;
          showDetail(el.dataset.id);
        });
      });
    }

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function openForm(id = null) {
      editingId = id;
      const buyFields = document.getElementById('buyFields');
      if (id) {
        document.getElementById('formTitle').textContent = '编辑推荐';
        const item = recommendations.find(r => r.id === id);
        if (!item) return;
        document.getElementById('inputName').value = item.name || '';
        document.getElementById('inputCode').value = item.code || '';
        document.getElementById('inputSource').value = item.source || '';
        document.getElementById('inputContent').value = item.content || '';
        document.getElementById('inputDate').value = toDateInputValue(item.recommend_date);
        document.querySelector('input[name="bought"][value="'+(item.is_bought?'1':'0')+'"]').checked = true;
        document.getElementById('inputBuyPrice').value = item.buy_price != null ? item.buy_price : '';
        document.getElementById('inputBuyShares').value = item.buy_shares != null ? item.buy_shares : '';
        document.getElementById('inputBuyAmount').value = item.buy_amount != null ? item.buy_amount : '';
        document.getElementById('inputBuyDate').value = toDateInputValue(item.buy_date);
        let buyType = item.buy_type || (item.buy_shares != null ? 'shares' : 'amount');
        const radio = document.querySelector('input[name="buyType"][value="'+buyType+'"]');
        if (radio) radio.checked = true;
        document.getElementById('sharesGroup').style.display = buyType === 'shares' ? 'block' : 'none';
        document.getElementById('amountGroup').style.display = buyType === 'amount' ? 'block' : 'none';
        item.is_bought ? buyFields.classList.add('show') : buyFields.classList.remove('show');
      } else {
        document.getElementById('formTitle').textContent = '添加推荐';
        ['inputName','inputCode','inputSource','inputContent','inputBuyPrice','inputBuyShares','inputBuyAmount','inputBuyDate'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('inputDate').value = toDateInputValue(Date.now());
        document.querySelector('input[name="bought"][value="0"]').checked = true;
        document.querySelector('input[name="buyType"][value="shares"]').checked = true;
        document.getElementById('sharesGroup').style.display = 'block';
        document.getElementById('amountGroup').style.display = 'none';
        buyFields.classList.remove('show');
      }
      showPage('formPage');
    }

    async function saveForm() {
      const name = document.getElementById('inputName').value.trim();
      if (!name) { alert('请填写股票/基金名称'); return; }
      const isBought = document.querySelector('input[name="bought"]:checked').value === '1';
      const buyType = document.querySelector('input[name="buyType"]:checked')?.value || 'shares';
      const data = {
        id: editingId || generateId(),
        name,
        code: document.getElementById('inputCode').value.trim() || null,
        source: document.getElementById('inputSource').value.trim() || null,
        content: document.getElementById('inputContent').value.trim() || null,
        recommend_date: fromDateInputValue(document.getElementById('inputDate').value) || Date.now(),
        is_bought: isBought,
        buy_price: isBought ? (parseFloat(document.getElementById('inputBuyPrice').value) || null) : null,
        buy_type: isBought ? buyType : null,
        buy_shares: isBought ? (parseFloat(document.getElementById('inputBuyShares').value) || null) : null,
        buy_amount: isBought ? (parseFloat(document.getElementById('inputBuyAmount').value) || null) : null,
        buy_date: isBought ? fromDateInputValue(document.getElementById('inputBuyDate').value) : null
      };
      try {
        await saveItem(data);
        if (editingId) {
          const idx = recommendations.findIndex(r => r.id === editingId);
          if (idx !== -1) recommendations[idx] = data;
        } else recommendations.unshift(data);
        renderList();
        showPage('listPage');
      } catch (e) {}
    }

    function showDetail(id) {
      const item = recommendations.find(r => r.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('detailTitle').textContent = item.name;
      const xqUrl = getXueqiuUrl(item.code);
      let html = `
        <div class="detail-label">代码</div>
        <div class="detail-value">${escapeHtml(item.code || '-')}${xqUrl ? ' &nbsp; <a class="xueqiu-btn" href="'+xqUrl+'" target="_blank" rel="noopener">在雪球查看</a>' : ''}</div>
        <div class="detail-label">推荐来源</div><div class="detail-value">${escapeHtml(item.source || '-')}</div>
        <div class="detail-label">推荐时间</div><div class="detail-value">${formatFullDate(item.recommend_date)}</div>
        <div class="detail-label">推荐内容</div><div class="detail-value detail-content">${escapeHtml(item.content || '无')}</div>`;
      if (item.is_bought) {
        let buyInfo = '已买入<br>';
        if (item.buy_date) buyInfo += '买入时间：' + formatFullDate(item.buy_date) + '<br>';
        if (item.buy_price) buyInfo += '买入价格：' + item.buy_price + '<br>';
        if (item.buy_type === 'shares' && item.buy_shares) buyInfo += '买入份数/股数：' + item.buy_shares;
        else if (item.buy_amount) buyInfo += '买入金额：' + item.buy_amount + ' 元';
        else if (item.buy_shares) buyInfo += '买入份数/股数：' + item.buy_shares;
        html += `<div class="detail-label" style="margin-top:16px;">我的操作</div><div class="detail-value">${buyInfo}</div>`;
      } else {
        html += `<div class="detail-label" style="margin-top:16px;">我的操作</div><div class="detail-value status-not">未买入</div>`;
      }
      document.getElementById('detailContent').innerHTML = html;
      showPage('detailPage');
    }

    // 详情页：点击卡片内容区域也可返回（编辑/删除/链接除外）
    document.addEventListener('click', function detailBlankBack(e) {
      const page = document.getElementById('detailPage');
      if (!page || !page.classList.contains('active')) return;
      // 点了按钮或链接不返回
      if (e.target.closest('button') || e.target.closest('a') || e.target.closest('.btn-row') || e.target.closest('.page-header')) return;
      // 点在详情页内（包括白色卡片）则返回列表
      if (page.contains(e.target)) showPage('listPage');
    });

    async function deleteItem() {
      if (!editingId || !confirm('确定删除这条记录吗？')) return;
      try {
        await deleteItemById(editingId);
        recommendations = recommendations.filter(r => r.id !== editingId);
        renderList();
        showPage('listPage');
      } catch (e) {}
    }


    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authError');
      errEl.textContent = '';
      if (!sbClient) { errEl.textContent = '网络组件未加载，请刷新页面'; return; }
      if (!email || !password) { errEl.textContent = '请填写邮箱和密码'; return; }
      if (password.length < 6) { errEl.textContent = '密码至少 6 位'; return; }
      showLoading(true);
      try {
        if (isRegisterMode) {
          const { error } = await sbClient.auth.signUp({ email, password });
          if (error) throw error;
          errEl.style.color = 'var(--accent)';
          errEl.textContent = '注册成功！请直接登录';
          setAuthMode(false);
        } else {
          const { error } = await sbClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showApp();
        }
      } catch (e) {
        console.error(e);
        errEl.style.color = 'var(--danger)';
        errEl.textContent = e.message || '操作失败，请重试';
      } finally { showLoading(false); }
    }

    function showApp() {
      document.getElementById('authPage').style.display = 'none';
      document.getElementById('appRoot').style.display = 'block';
      loadData();
    }
    function showAuth() {
      document.getElementById('authPage').style.display = 'flex';
      document.getElementById('appRoot').style.display = 'none';
    }
    async function logout() {
      await sbClient.auth.signOut();
      recommendations = [];
      showAuth();
    }

    document.getElementById('authSubmitBtn').addEventListener('click', handleAuth);
    document.getElementById('authPassword').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
    document.getElementById('addBtn').addEventListener('click', () => openForm());
    document.getElementById('formBackBtn').addEventListener('click', () => showPage('listPage'));
    document.getElementById('formCancelBtn').addEventListener('click', () => showPage('listPage'));
    document.getElementById('formSaveBtn').addEventListener('click', saveForm);
    document.getElementById('detailBackBtn').addEventListener('click', () => showPage('listPage'));
    document.getElementById('detailEditBtn').addEventListener('click', () => openForm(editingId));
    document.getElementById('detailDeleteBtn').addEventListener('click', deleteItem);
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('trashBtn').addEventListener('click', async () => {
      const list = await loadDeleted();
      const box = document.getElementById('trashList');
      if (!list.length) {
        box.innerHTML = '<div class="empty">回收站是空的</div>';
      } else {
        box.innerHTML = list.map(item => `
          <div class="card">
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-code">${escapeHtml(item.code || '')}</div>
            <div class="card-meta">删除于 ${formatFullDate(item.deleted_at)}</div>
            <div class="card-actions">
              <button class="mini-btn primary" data-recover="${item.id}">恢复</button>
              <button class="mini-btn" data-purge="${item.id}" style="color:#C75B5B;">彻底删除</button>
            </div>
          </div>
        `).join('');
        box.querySelectorAll('[data-recover]').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              await recoverItem(btn.dataset.recover);
              btn.closest('.card').remove();
              if (!box.querySelector('.card')) box.innerHTML = '<div class="empty">回收站是空的</div>';
              await loadData();
            } catch (e) {}
          });
        });
        box.querySelectorAll('[data-purge]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('彻底删除后无法恢复，确定？')) return;
            try {
              await permanentDelete(btn.dataset.purge);
              btn.closest('.card').remove();
              if (!box.querySelector('.card')) box.innerHTML = '<div class="empty">回收站是空的</div>';
            } catch (e) {}
          });
        });
      }
      showPage('trashPage');
    });
    document.getElementById('trashBackBtn').addEventListener('click', () => showPage('listPage'));

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });
    document.getElementById('viewToggleBtn').addEventListener('click', () => {
      currentView = currentView === 'card' ? 'table' : 'card';
      document.getElementById('viewToggleBtn').textContent = currentView === 'card' ? '≡' : '⊞';
      renderList();
    });
    document.querySelectorAll('input[name="bought"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.getElementById('buyFields').classList.toggle('show', radio.value === '1' && radio.checked);
      });
    });
    document.querySelectorAll('input[name="buyType"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isShares = radio.value === 'shares';
        document.getElementById('sharesGroup').style.display = isShares ? 'block' : 'none';
        document.getElementById('amountGroup').style.display = isShares ? 'none' : 'block';
      });
    });

    // 自动计算：金额 ≈ 价格 × 数量（并明确显示）
    function autoCalcBuy() {
      const price = parseFloat(document.getElementById('inputBuyPrice').value);
      const shares = parseFloat(document.getElementById('inputBuyShares').value);
      const amount = parseFloat(document.getElementById('inputBuyAmount').value);
      const amountInput = document.getElementById('inputBuyAmount');
      const sharesInput = document.getElementById('inputBuyShares');
      const hintA = document.getElementById('calcAmountHint');
      const hintS = document.getElementById('calcSharesHint');
      const buyType = document.querySelector('input[name="buyType"]:checked')?.value || 'shares';
      if (buyType === 'shares') {
        if (!isNaN(price) && !isNaN(shares) && price > 0 && shares > 0) {
          const total = price * shares;
          amountInput.value = total.toFixed(2);
          if (hintA) {
            hintA.style.display = 'block';
            hintA.textContent = '约合金额：' + total.toFixed(2) + ' 元';
          }
        } else if (hintA) {
          hintA.style.display = 'none';
          hintA.textContent = '';
        }
        if (hintS) hintS.style.display = 'none';
      } else {
        if (!isNaN(price) && !isNaN(amount) && price > 0 && amount > 0) {
          const qty = amount / price;
          sharesInput.value = qty.toFixed(2);
          if (hintS) {
            hintS.style.display = 'block';
            hintS.textContent = '约合数量：' + qty.toFixed(2);
          }
        } else if (hintS) {
          hintS.style.display = 'none';
          hintS.textContent = '';
        }
        if (hintA) hintA.style.display = 'none';
      }
    }
    ['inputBuyPrice', 'inputBuyShares', 'inputBuyAmount'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', autoCalcBuy);
    });

    const STOCK_DICT = {
      '600519':'贵州茅台','000858':'五粮液','601318':'中国平安','600036':'招商银行',
      '000333':'美的集团','300750':'宁德时代','002594':'比亚迪','510300':'沪深300ETF',
      '159915':'创业板ETF','161725':'招商中证白酒','005827':'易方达蓝筹精选'
    };
    document.getElementById('inputCode').addEventListener('blur', function() {
      const code = this.value.trim();
      if (code && STOCK_DICT[code] && !document.getElementById('inputName').value.trim()) {
        document.getElementById('inputName').value = STOCK_DICT[code];
      }
    });

    // Google / Facebook 登录
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      if (!sbClient) {
        document.getElementById('authError').textContent = '网络组件未加载，请刷新页面';
        return;
      }
      const { error } = await sbClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) {
        document.getElementById('authError').textContent = error.message || 'Google 登录失败，请先在 Supabase 开通';
      }
    });

    // 绑定初始「去注册」链接
    (function(){
      var a = document.getElementById('switchToRegister');
      if (a) a.onclick = function(){ setAuthMode(true); return false; };
    })();

    if (!sbClient) {
      document.getElementById('authError').textContent = '网络组件加载失败，请刷新重试或检查网络';
      showAuth();
      setAuthMode(false);
    } else {
      sbClient.auth.getSession().then(function(res) {
        var session = res.data && res.data.session;
        if (session) showApp();
        else { showAuth(); setAuthMode(false); }
      }).catch(function() {
        showAuth();
        setAuthMode(false);
      });
    }
  </script>
</body>
</html>

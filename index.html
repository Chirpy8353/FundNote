<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F7F5F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>基金股票推荐整理</title>
  <style>
    :root {
      --bg: #F7F5F2;
      --card: #FFFFFF;
      --text: #3A3A3A;
      --text2: #7A7A7A;
      --accent: #5B8A8A;
      --accent-soft: #E8F0F0;
      --divider: #E8E4DF;
      --header: #F0EDE8;
      --danger: #C75B5B;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: var(--header);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 18px;
    }

    .icon-btn:active {
      opacity: 0.7;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      background: var(--bg);
    }

    .filter-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--divider);
      background: var(--card);
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .list-container {
      padding: 0 16px 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-code {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 8px;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .card-content {
      font-size: 14px;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .card-status {
      font-size: 13px;
      font-weight: 500;
    }

    .status-bought {
      color: var(--accent);
    }

    .status-not {
      color: var(--text2);
    }

    .table-header {
      display: grid;
      grid-template-columns: 2fr 0.9fr 0.7fr 1fr;
      gap: 8px;
      padding: 10px 12px;
      background: var(--header);
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      color: var(--text2);
      font-weight: 500;
    }

    .table-row {
      display: grid;
      grid-template-columns: 2fr 0.9fr 0.7fr 1fr;
      gap: 8px;
      padding: 14px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      font-size: 13px;
      align-items: center;
    }

    .table-row:last-child {
      border-bottom: none;
      border-radius: 0 0 8px 8px;
    }

    .table-row:active {
      background: var(--accent-soft);
    }

    .table-name {
      font-weight: 500;
    }

    .table-code {
      font-size: 11px;
      color: var(--text2);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
      font-size: 15px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(91, 138, 138, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .fab:active {
      transform: scale(0.95);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .form-page, .detail-page {
      padding: 0 16px 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--header);
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
    }

    .page-title {
      font-size: 17px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--divider);
      border-radius: 10px;
      background: var(--card);
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      padding: 8px 0;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
    }

    .buy-fields {
      display: none;
      margin-top: 12px;
      padding: 14px;
      background: var(--header);
      border-radius: 10px;
    }

    .buy-fields.show {
      display: block;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: var(--header);
      color: var(--text);
    }

    .btn-danger {
      background: #FDF0F0;
      color: var(--danger);
    }

    .detail-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .detail-label {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 15px;
      margin-bottom: 14px;
    }

    .detail-value:last-child {
      margin-bottom: 0;
    }

    .detail-content {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(247, 245, 242, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      font-size: 15px;
      color: var(--text2);
    }

    .loading-overlay.hidden {
      display: none;
    }

    .error-banner {
      background: #FDF0F0;
      color: var(--danger);
      padding: 10px 16px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .error-banner.show {
      display: block;
    }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay">
    正在同步数据...
  </div>

  <div id="errorBanner" class="error-banner"></div>

  <!-- 主列表页 -->
  <div id="listPage" class="page active">
    <div class="topbar">
      <h1>基金股票推荐整理</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="refreshBtn" title="刷新数据">↻</button>
        <button class="icon-btn" id="viewToggleBtn" title="切换视图">≡</button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="bought">已买入</button>
      <button class="filter-btn" data-filter="not">未买入</button>
    </div>

    <div class="list-container" id="listContainer"></div>

    <button class="fab" id="addBtn">+</button>
  </div>

  <!-- 添加 / 编辑页 -->
  <div id="formPage" class="page">
    <div class="form-page">
      <div class="page-header">
        <button class="back-btn" id="formBackBtn">←</button>
        <div class="page-title" id="formTitle">添加推荐</div>
      </div>

      <div class="form-group">
        <label>股票 / 基金名称 *</label>
        <input type="text" id="inputName" placeholder="例如：贵州茅台" />
      </div>

      <div class="form-group">
        <label>代码</label>
        <input type="text" id="inputCode" placeholder="例如：600519" />
      </div>

      <div class="form-group">
        <label>推荐来源</label>
        <input type="text" id="inputSource" placeholder="例如：某公众号 / 雪球 / 研报" />
      </div>

      <div class="form-group">
        <label>推荐内容</label>
        <textarea id="inputContent" placeholder="推荐理由或要点..."></textarea>
      </div>

      <div class="form-group">
        <label>推荐时间</label>
        <input type="date" id="inputDate" />
      </div>

      <div class="form-group">
        <label>是否买入</label>
        <div class="radio-group">
          <label><input type="radio" name="bought" value="0" checked /> 否</label>
          <label><input type="radio" name="bought" value="1" /> 是</label>
        </div>

        <div class="buy-fields" id="buyFields">
          <div class="form-group">
            <label>买入价格</label>
            <input type="number" id="inputBuyPrice" placeholder="可选" step="0.01" />
          </div>
          <div class="form-group">
            <label>买入金额（元）</label>
            <input type="number" id="inputBuyAmount" placeholder="可选" step="0.01" />
          </div>
          <div class="form-group">
            <label>买入时间</label>
            <input type="date" id="inputBuyDate" />
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="formCancelBtn">取消</button>
        <button class="btn btn-primary" id="formSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 详情页 -->
  <div id="detailPage" class="page">
    <div class="detail-page">
      <div class="page-header">
        <button class="back-btn" id="detailBackBtn">←</button>
        <div class="page-title" id="detailTitle">详情</div>
      </div>

      <div class="detail-section" id="detailContent"></div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="detailEditBtn">编辑</button>
        <button class="btn btn-danger" id="detailDeleteBtn">删除</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 配置区（必须修改） ====================
    // 1. 打开 https://jsonbin.io 注册免费账号
    // 2. 创建一个新的 Bin，内容填写：[]
    // 3. 复制 Bin ID 和 Master Key，替换下面两行
    const JSONBIN_BIN_ID = '6a850b22da38895dfef52d94';
    const JSONBIN_API_KEY = '$2a$10$gh2tRCEQjDYTT/gIEFIet.bAuZ4sdiNZUlk3y6iwNc5H37hWgvRr2';

    // ==================== 数据管理 ====================
    let recommendations = [];
    let currentFilter = 'all';
    let currentView = 'card';
    let editingId = null;
    let isSaving = false;

    function showLoading(show) {
      document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
    }

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      if (msg) {
        banner.textContent = msg;
        banner.classList.add('show');
      } else {
        banner.classList.remove('show');
      }
    }

    async function loadData() {
      showLoading(true);
      showError('');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        if (!res.ok) throw new Error('读取失败 ' + res.status);
        const json = await res.json();
        // 适配 {"list": []} 结构
        if (json.record && Array.isArray(json.record.list)) {
          recommendations = json.record.list;
        } else if (Array.isArray(json.record)) {
          recommendations = json.record;
        } else {
          recommendations = [];
        }
      } catch (e) {
        console.error(e);
        showError('无法同步数据，请检查网络或配置');
        recommendations = [];
      } finally {
        showLoading(false);
        renderList();
      }
    }

    async function saveData() {
      if (isSaving) return;
      isSaving = true;
      showLoading(true);
      showError('');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify({ list: recommendations })
        });
        if (!res.ok) throw new Error('保存失败 ' + res.status);
      } catch (e) {
        console.error(e);
        showError('保存到云端失败，请检查网络后重试');
        alert('保存失败，请检查网络连接后重试');
      } finally {
        isSaving = false;
        showLoading(false);
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function formatDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return m + '-' + day;
    }

    function formatFullDate(ts) {
      if (!ts) return '-';
      return new Date(ts).toLocaleDateString('zh-CN');
    }

    function getFiltered() {
      if (currentFilter === 'bought') return recommendations.filter(r => r.isBought);
      if (currentFilter === 'not') return recommendations.filter(r => !r.isBought);
      return recommendations;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      const list = getFiltered().sort((a, b) => b.recommendDate - a.recommendDate);

      if (list.length === 0) {
        container.innerHTML = '<div class="empty">暂无记录<br>点击右下角 + 添加第一条推荐</div>';
        return;
      }

      if (currentView === 'card') {
        container.innerHTML = list.map(item => `
          <div class="card" data-id="${item.id}">
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-code">${escapeHtml(item.code || '')}</div>
            <div class="card-meta">来源：${escapeHtml(item.source || '未填写')} · ${formatDate(item.recommendDate)}</div>
            <div class="card-content">${escapeHtml(item.content || '')}</div>
            <div class="card-status ${item.isBought ? 'status-bought' : 'status-not'}">
              ${item.isBought ? '已买入' + (item.buyPrice ? ' · 买入价 ' + item.buyPrice : '') : '未买入'}
            </div>
          </div>
        `).join('');
      } else {
        let html = `
          <div class="table-header">
            <div>名称/代码</div>
            <div>日期</div>
            <div>状态</div>
            <div>来源</div>
          </div>
        `;
        html += list.map(item => `
          <div class="table-row" data-id="${item.id}">
            <div>
              <div class="table-name">${escapeHtml(item.name)}</div>
              <div class="table-code">${escapeHtml(item.code || '')}</div>
            </div>
            <div>${formatDate(item.recommendDate)}</div>
            <div class="${item.isBought ? 'status-bought' : 'status-not'}">${item.isBought ? '已买' : '未买'}</div>
            <div style="color:var(--text2);font-size:12px;">${escapeHtml(item.source || '-')}</div>
          </div>
        `).join('');
        container.innerHTML = html;
      }

      container.querySelectorAll('[data-id]').forEach(el => {
        el.addEventListener('click', () => showDetail(el.dataset.id));
      });
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function openForm(id = null) {
      editingId = id;
      const formTitle = document.getElementById('formTitle');
      const buyFields = document.getElementById('buyFields');

      if (id) {
        formTitle.textContent = '编辑推荐';
        const item = recommendations.find(r => r.id === id);
        if (!item) return;

        document.getElementById('inputName').value = item.name || '';
        document.getElementById('inputCode').value = item.code || '';
        document.getElementById('inputSource').value = item.source || '';
        document.getElementById('inputContent').value = item.content || '';
        document.getElementById('inputDate').value = item.recommendDate ? new Date(item.recommendDate).toISOString().slice(0, 10) : '';
        document.querySelector('input[name="bought"][value="' + (item.isBought ? '1' : '0') + '"]').checked = true;
        document.getElementById('inputBuyPrice').value = item.buyPrice || '';
        document.getElementById('inputBuyAmount').value = item.buyAmount || '';
        document.getElementById('inputBuyDate').value = item.buyDate ? new Date(item.buyDate).toISOString().slice(0, 10) : '';

        if (item.isBought) buyFields.classList.add('show');
        else buyFields.classList.remove('show');
      } else {
        formTitle.textContent = '添加推荐';
        document.getElementById('inputName').value = '';
        document.getElementById('inputCode').value = '';
        document.getElementById('inputSource').value = '';
        document.getElementById('inputContent').value = '';
        document.getElementById('inputDate').value = new Date().toISOString().slice(0, 10);
        document.querySelector('input[name="bought"][value="0"]').checked = true;
        document.getElementById('inputBuyPrice').value = '';
        document.getElementById('inputBuyAmount').value = '';
        document.getElementById('inputBuyDate').value = '';
        buyFields.classList.remove('show');
      }

      showPage('formPage');
    }

    async function saveForm() {
      const name = document.getElementById('inputName').value.trim();
      if (!name) {
        alert('请填写股票/基金名称');
        return;
      }

      const isBought = document.querySelector('input[name="bought"]:checked').value === '1';
      const recommendDateStr = document.getElementById('inputDate').value;
      const buyDateStr = document.getElementById('inputBuyDate').value;

      const data = {
        id: editingId || generateId(),
        name: name,
        code: document.getElementById('inputCode').value.trim(),
        source: document.getElementById('inputSource').value.trim(),
        content: document.getElementById('inputContent').value.trim(),
        recommendDate: recommendDateStr ? new Date(recommendDateStr).getTime() : Date.now(),
        isBought: isBought,
        buyPrice: isBought ? (parseFloat(document.getElementById('inputBuyPrice').value) || null) : null,
        buyAmount: isBought ? (parseFloat(document.getElementById('inputBuyAmount').value) || null) : null,
        buyDate: isBought && buyDateStr ? new Date(buyDateStr).getTime() : null
      };

      if (editingId) {
        const idx = recommendations.findIndex(r => r.id === editingId);
        if (idx !== -1) recommendations[idx] = data;
      } else {
        recommendations.push(data);
      }

      await saveData();
      renderList();
      showPage('listPage');
    }

    function showDetail(id) {
      const item = recommendations.find(r => r.id === id);
      if (!item) return;

      editingId = id;
      document.getElementById('detailTitle').textContent = item.name;

      let html = `
        <div class="detail-label">代码</div>
        <div class="detail-value">${escapeHtml(item.code || '-')}</div>
        <div class="detail-label">推荐来源</div>
        <div class="detail-value">${escapeHtml(item.source || '-')}</div>
        <div class="detail-label">推荐时间</div>
        <div class="detail-value">${formatFullDate(item.recommendDate)}</div>
        <div class="detail-label">推荐内容</div>
        <div class="detail-value detail-content">${escapeHtml(item.content || '无')}</div>
      `;

      if (item.isBought) {
        html += `
          <div class="detail-label" style="margin-top:16px;">我的操作</div>
          <div class="detail-value">
            已买入<br>
            ${item.buyDate ? '买入时间：' + formatFullDate(item.buyDate) + '<br>' : ''}
            ${item.buyPrice ? '买入价格：' + item.buyPrice + '<br>' : ''}
            ${item.buyAmount ? '买入金额：' + item.buyAmount + ' 元' : ''}
          </div>
        `;
      } else {
        html += `
          <div class="detail-label" style="margin-top:16px;">我的操作</div>
          <div class="detail-value status-not">未买入</div>
        `;
      }

      document.getElementById('detailContent').innerHTML = html;
      showPage('detailPage');
    }

    async function deleteItem() {
      if (!editingId) return;
      if (!confirm('确定删除这条记录吗？')) return;

      recommendations = recommendations.filter(r => r.id !== editingId);
      await saveData();
      renderList();
      showPage('listPage');
    }

    // 事件绑定
    document.getElementById('addBtn').addEventListener('click', () => openForm());
    document.getElementById('formBackBtn').addEventListener('click', () => showPage('listPage'));
    document.getElementById('formCancelBtn').addEventListener('click', () => showPage('listPage'));
    document.getElementById('formSaveBtn').addEventListener('click', saveForm);
    document.getElementById('detailBackBtn').addEventListener('click', () => showPage('listPage'));
    document.getElementById('detailEditBtn').addEventListener('click', () => openForm(editingId));
    document.getElementById('detailDeleteBtn').addEventListener('click', deleteItem);
    document.getElementById('refreshBtn').addEventListener('click', loadData);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });

    document.getElementById('viewToggleBtn').addEventListener('click', () => {
      currentView = currentView === 'card' ? 'table' : 'card';
      document.getElementById('viewToggleBtn').textContent = currentView === 'card' ? '≡' : '⊞';
      renderList();
    });

    document.querySelectorAll('input[name="bought"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const buyFields = document.getElementById('buyFields');
        if (radio.value === '1' && radio.checked) {
          buyFields.classList.add('show');
        } else {
          buyFields.classList.remove('show');
        }
      });
    });

    // 初始化
    if (JSONBIN_BIN_ID.includes('请替换') || JSONBIN_API_KEY.includes('请替换')) {
      showLoading(false);
      document.getElementById('listContainer').innerHTML = `
        <div class="empty" style="padding:40px 20px; line-height:1.8;">
          <strong>还没有配置云端存储</strong><br><br>
          请先按 README 说明操作：<br>
          1. 去 jsonbin.io 注册并创建 Bin<br>
          2. 把 Bin ID 和 Master Key 填进代码<br>
          3. 再上传到 GitHub Pages
        </div>
      `;
    } else {
      loadData();
    }
  </script>
</body>
</html>
